name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # OG 图构建期用 sharp 光栅化中文标题，ubuntu runner 需预装 Noto CJK 字体
      - name: Install Chinese fonts for OG image rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          build-cmd: npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
